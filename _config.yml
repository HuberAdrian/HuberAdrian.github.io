title: Adrian Huber
description: Personal website and blog
url: https://adrian-huber.org
baseurl: ""

# GitHub Pages automatically sets the following
markdown: kramdown
lsi: false
safe: true
highlighter: rouge
gist:
  noscript: false
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

# Plugins. All ship with the github-pages gem; they must still be listed
# here or they never load (jekyll-feed was in the Gemfile but inactive).
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Keep agent notes and build files out of the published site
# NOTE: setting `exclude` REPLACES Jekyll's default list, so the defaults are
# repeated here on purpose.
exclude:
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata

# Add excerpt separator
excerpt_separator: <!--more-->

# Collections
collections:
  posts:
    output: true
    permalink: /writing/:title/
  research:
    output: true
    permalink: /research/:title/
  projects:
    output: true
    permalink: /projects/:title/

# Default layouts
defaults:
  -
    scope:
      path: ""
    values:
      layout: default
  -
    scope:
      path: "_posts"
    values:
      layout: post
  -
    scope:
      path: "_research"
    values:
      layout: research
  -
    scope:
      path: "_projects"
    values:
      layout: project